statement:
  kicker: "Artist Statement"
  lead: "Repetition is a myth — each iteration carries the temporal signature of its moment."
  body: >-
    What masquerades as return is actually <b>departure</b>; what appears
    cyclical reveals itself as <b>spiral</b>. Time itself ensures that no
    gesture, no sound, no form can truly repeat, for difference inhabits the
    very core of what we mistake for sameness.
  signature: "Bruce Nemeth"

about:
  eyebrow: "About the artist"
  portrait:
    src: "/images/bruce-main.JPG"
    alt: "Portrait of Bruce Nemeth"
    w: 1600
    h: 2400
    caption: "In the studio"
  lead: >-
    I am an interdisciplinary artist living and working in the UK — art
    director and curator, weaving installation and sound into
    cross-disciplinary, multisensory explorations.
  text: >-
    My art is rooted in the choreography of internal behaviours — where
    repetition and randomness shape reflective environments and sonic
    encounters. Each project invites immersion in chance, memory, and self: an
    attention paid to the small departures that live inside every act of
    returning.
